<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Year Bucket List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Senior Year Bucket List</h1>
    <p class="subtitle">Everything I want to do before I graduate.</p>
  </header>

  <main>
    <section class="todays-goal" id="todaysGoal" aria-label="Today's goal"></section>

    <section class="progress" aria-label="Progress">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-label" id="progressLabel"></p>
    </section>

    <section class="filters" aria-label="Filter goals">
      <fieldset class="filter-group" data-filter-key="scope">
        <legend>Scope</legend>
        <label class="filter-pill">
          <input type="checkbox" value="university" checked>
          <span>University</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="city" checked>
          <span>City</span>
        </label>
      </fieldset>

      <fieldset class="filter-group" data-filter-key="frequency">
        <legend>Frequency</legend>
        <label class="filter-pill">
          <input type="checkbox" value="one-time" checked>
          <span>One-time</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="ongoing" checked>
          <span>Ongoing</span>
        </label>
      </fieldset>

      <fieldset class="filter-group" data-filter-key="effort">
        <legend>Effort</legend>
        <label class="filter-pill">
          <input type="checkbox" value="simple" checked>
          <span>Simple</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="complex" checked>
          <span>Complex</span>
        </label>
      </fieldset>
    </section>

    <p class="result-count" id="resultCount"></p>

    <ul class="goal-list" id="goalList" aria-live="polite"></ul>

    <section class="campus-map" aria-label="Campus map">
      <h2>Campus Map</h2>
      <p class="map-hint">
        Click an empty spot to pin a campus goal that doesn't have one yet.
        Click an existing pin to remove it.
      </p>
      <div class="map-container" id="mapContainer">
        <img src="map1.png" alt="University of Guelph campus map" id="mapImage">
      </div>
      <button type="button" id="downloadGoalsBtn" class="download-btn" hidden>
        Download updated goals.json
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
