<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Year Bucket List</title>
  <link rel="icon" type="image/png" href="gryphon-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="page-header-title">
      <img src="gryphon-logo.png" alt="Gryphon logo" class="site-logo">
      <h1>Senior Year Bucket List</h1>
    </div>
    <p class="subtitle">Everything I want to do before I graduate.</p>
    <p class="last-updated" id="lastUpdated"></p>
    <div class="header-actions">
      <button type="button" id="printBtn" class="print-btn">Print / Save as PDF</button>
      <a href="campus-map.html" class="print-btn">Campus Map</a>
      <a href="make-it-yours.html" class="print-btn">Make it yours</a>
    </div>
  </header>

  <main>
    <section class="todays-goal" id="todaysGoal" aria-label="Today's goal"></section>

    <section class="progress" aria-label="Progress">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-label" id="progressLabel"></p>
    </section>

    <section class="filters" aria-label="Filter goals">
      <fieldset class="filter-group" data-filter-key="category">
        <legend>Category</legend>
        <div class="filter-group-actions">
          <button type="button" class="filter-action" data-action="all">All</button>
          <button type="button" class="filter-action" data-action="none">None</button>
        </div>
        <label class="filter-pill">
          <input type="checkbox" value="clubs-involvements" checked>
          <span>Clubs &amp; Involvements</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="academic" checked>
          <span>Academic</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="volunteering" checked>
          <span>Volunteering</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="seasonal" checked>
          <span>Seasonal</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="city" checked>
          <span>City</span>
        </label>
      </fieldset>

      <fieldset class="filter-group" data-filter-key="frequency">
        <legend>Frequency</legend>
        <div class="filter-group-actions">
          <button type="button" class="filter-action" data-action="all">All</button>
          <button type="button" class="filter-action" data-action="none">None</button>
        </div>
        <label class="filter-pill">
          <input type="checkbox" value="one-time" checked>
          <span>One-time</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="ongoing" checked>
          <span>Ongoing</span>
        </label>
      </fieldset>

      <fieldset class="filter-group" data-filter-key="effort">
        <legend>Effort</legend>
        <div class="filter-group-actions">
          <button type="button" class="filter-action" data-action="all">All</button>
          <button type="button" class="filter-action" data-action="none">None</button>
        </div>
        <label class="filter-pill">
          <input type="checkbox" value="simple" checked>
          <span>Simple</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="complex" checked>
          <span>Complex</span>
        </label>
      </fieldset>

      <fieldset class="filter-group" data-filter-key="status">
        <legend>Status</legend>
        <div class="filter-group-actions">
          <button type="button" class="filter-action" data-action="all">All</button>
          <button type="button" class="filter-action" data-action="none">None</button>
        </div>
        <label class="filter-pill">
          <input type="checkbox" value="not-started" checked>
          <span>Not Started</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="in-progress" checked>
          <span>In Progress</span>
        </label>
        <label class="filter-pill">
          <input type="checkbox" value="done" checked>
          <span>Done</span>
        </label>
      </fieldset>
    </section>

    <p class="result-count" id="resultCount"></p>

    <div id="goalList" aria-live="polite"></div>

    <div class="print-checklist" id="printChecklist"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
